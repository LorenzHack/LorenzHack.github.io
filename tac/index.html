<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TAC</title>
  <style>
    :root { --grund: #F1ECDF; --tinte: #14181F; --grau: #6E7382; --blau: #2B5FAA; }
    @media (prefers-color-scheme: dark) { :root { --grund: #12151C; --tinte: #ECE8DC; --grau: #9AA0AA; --blau: #8DB4EE; } }
    body { margin: 0; background: var(--grund); color: var(--tinte); font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 680px; margin: 0 auto; padding: 32px 16px; }
    .kicker { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 2.5px; color: var(--grau); }
    h1 { margin: 2px 0 16px; font: italic 700 34px/1.15 Georgia, "Times New Roman", serif; }
    a { color: var(--blau); }
  </style>
</head>
<body>
  <main>
    <p class="kicker">APP</p>
    <h1>TAC</h1>
    <p><a href="/tac/datenschutz/">Datenschutz · Privacy</a></p>
  </main>
</body>
</html>
